services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-digizafe}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-digizafe_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-digizafe}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-digizafe} -d ${POSTGRES_DB:-digizafe}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - digizafe

  redis-broker:
    image: redis:7-alpine
    command: redis-server /usr/local/etc/redis/redis.conf
    volumes:
      - ./infrastructure/redis/redis-broker.conf:/usr/local/etc/redis/redis.conf:ro
      - redis_broker_data:/data
    ports:
      - "6381:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - digizafe

  redis-cache:
    image: redis:7-alpine
    command: redis-server /usr/local/etc/redis/redis.conf
    volumes:
      - ./infrastructure/redis/redis-cache.conf:/usr/local/etc/redis/redis.conf:ro
      - redis_cache_data:/data
    ports:
      - "6382:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - digizafe

  api:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-digizafe}:${POSTGRES_PASSWORD:-digizafe_dev_password}@postgres:5432/${POSTGRES_DB:-digizafe}
      REDIS_BROKER_URL: redis://redis-broker:6379/0
      REDIS_CACHE_URL: redis://redis-cache:6379/0
      CELERY_BROKER_URL: redis://redis-broker:6379/0
      CELERY_RESULT_BACKEND: redis://redis-broker:6379/1
    volumes:
      - ./backend:/app/backend
      - ./shared:/app/shared
      - ./secrets:/app/secrets
      - ./ml:/app/backend/ml
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis-broker:
        condition: service_healthy
      redis-cache:
        condition: service_healthy
    networks:
      - digizafe
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  worker:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile
    command: celery -A app.worker.celery_app worker --loglevel=INFO --concurrency=2 -Q celery,identity_enrichment,osint_connectors
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-digizafe}:${POSTGRES_PASSWORD:-digizafe_dev_password}@postgres:5432/${POSTGRES_DB:-digizafe}
      REDIS_BROKER_URL: redis://redis-broker:6379/0
      REDIS_CACHE_URL: redis://redis-cache:6379/0
      CELERY_BROKER_URL: redis://redis-broker:6379/0
      CELERY_RESULT_BACKEND: redis://redis-broker:6379/1
    volumes:
      - ./backend:/app/backend
      - ./shared:/app/shared
      - ./secrets:/app/secrets
      - ./ml:/app/backend/ml
    depends_on:
      postgres:
        condition: service_healthy
      redis-broker:
        condition: service_healthy
      redis-cache:
        condition: service_healthy
    networks:
      - digizafe

  remediation-worker:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile
    command: celery -A app.worker.celery_app worker --loglevel=INFO --concurrency=1 -Q celery
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-digizafe}:${POSTGRES_PASSWORD:-digizafe_dev_password}@postgres:5432/${POSTGRES_DB:-digizafe}
      REDIS_BROKER_URL: redis://redis-broker:6379/0
      REDIS_CACHE_URL: redis://redis-cache:6379/0
      CELERY_BROKER_URL: redis://redis-broker:6379/0
      CELERY_RESULT_BACKEND: redis://redis-broker:6379/1
      PLAYWRIGHT_HEADLESS: "true"
    volumes:
      - ./backend:/app/backend
      - ./shared:/app/shared
      - ./secrets:/app/secrets
    depends_on:
      postgres:
        condition: service_healthy
      redis-broker:
        condition: service_healthy
    networks:
      - digizafe

  beat:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile
    command: celery -A app.worker.celery_app beat --loglevel=INFO
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-digizafe}:${POSTGRES_PASSWORD:-digizafe_dev_password}@postgres:5432/${POSTGRES_DB:-digizafe}
      CELERY_BROKER_URL: redis://redis-broker:6379/0
      CELERY_RESULT_BACKEND: redis://redis-broker:6379/1
    volumes:
      - ./backend:/app/backend
      - ./shared:/app/shared
    depends_on:
      - redis-broker
      - worker
    networks:
      - digizafe

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: /api/v1
    ports:
      - "5173:80"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - digizafe
    profiles:
      - frontend

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infrastructure/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
    networks:
      - digizafe
    profiles:
      - with-caddy   # optional: docker compose --profile with-caddy up

volumes:
  postgres_data:
  redis_broker_data:
  redis_cache_data:
  caddy_data:
  caddy_config:

networks:
  digizafe:
    driver: bridge
