name: DigiZafe CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.11"
        cache: "pip"

    - name: Install backend dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r backend/requirements.txt

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: "20"
        cache: "npm"
        cache-dependency-path: frontend/package-lock.json

    - name: Create .env file for Docker Compose
      run: cp .env.example .env

    - name: Start Infrastructure (PostgreSQL & Redis)
      run: docker compose -f docker-compose.yml up -d postgres redis-broker redis-cache

    - name: Wait for Infrastructure Readiness
      run: |
        # Wait for PostgreSQL
        until docker compose exec -T postgres pg_isready -U digizafe; do
          echo "Waiting for postgres..."
          sleep 2
        done
        # Wait for Redis
        until docker compose exec -T redis-broker redis-cli ping; do
          echo "Waiting for redis..."
          sleep 2
        done

    - name: Check Alembic Heads
      working-directory: ./backend
      run: python -m alembic heads


    - name: Build Frontend
      working-directory: ./frontend
      run: |
        npm ci
        npm run build

    - name: Dependency & Secret Scan
      run: |
        # Placeholder for actual scan commands, e.g., trivy, git-secrets
        echo "Running secret scan..."
        echo "Running dependency audit..."
